<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #2c3e50;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            border: 4px solid #534b3e;
            border-radius: 8px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
        }

        canvas {
            display: block;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            z-index: 10;
        }

        #overlay.hidden {
            display: none;
        }

        #overlay h1 {
            color: #fff;
            font-size: 48px;
            text-shadow: 3px 3px 0 #534b3e, -1px -1px 0 #534b3e;
            margin-bottom: 10px;
        }

        #overlay .subtitle {
            color: #ffd700;
            font-size: 20px;
            text-shadow: 2px 2px 0 #534b3e;
            margin-bottom: 30px;
        }

        #overlay .score-display {
            color: #fff;
            font-size: 32px;
            text-shadow: 2px 2px 0 #534b3e;
            margin-bottom: 10px;
        }

        #overlay .best-score {
            color: #ffd700;
            font-size: 18px;
            text-shadow: 2px 2px 0 #534b3e;
            margin-bottom: 30px;
        }

        #overlay .start-btn {
            padding: 15px 40px;
            font-size: 22px;
            background: #e67e22;
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-shadow: 1px 1px 0 rgba(0,0,0,0.3);
            box-shadow: 0 4px 0 #c0651a, 0 6px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        #overlay .start-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #c0651a, 0 8px 12px rgba(0,0,0,0.3);
        }

        #overlay .start-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #c0651a, 0 3px 6px rgba(0,0,0,0.3);
        }

        #overlay .instructions {
            color: #ddd;
            font-size: 14px;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
        <div id="overlay">
            <h1>Flappy Bird</h1>
            <div class="subtitle">A classic arcade game</div>
            <div class="score-display" id="finalScore" style="display:none;"></div>
            <div class="best-score" id="bestScore" style="display:none;"></div>
            <button class="start-btn" id="startBtn">Play</button>
            <div class="instructions">Press Space, Click, or Tap to flap</div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
